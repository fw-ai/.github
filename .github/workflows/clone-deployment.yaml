name: Clone Deployment

on:
  workflow_dispatch:
    inputs:
      source_deployment:
        description: "Source deployment to clone (ID or full resource name)"
        required: true
        type: string
      source_account:
        description: "Account ID that owns the source deployment"
        required: true
        type: string
      target_account:
        description: "Account ID to create the clone in (defaults to source_account)"
        required: false
        type: string
      deployment_id:
        description: "ID for the new deployment (auto-generated if empty)"
        required: false
        type: string
      display_name:
        description: "Display name for the cloned deployment"
        required: false
        type: string
      min_replica_count:
        description: "Minimum replica count override"
        required: false
        type: string
      max_replica_count:
        description: "Maximum replica count override"
        required: false
        type: string
      accelerator_type:
        description: "Accelerator type override (e.g. NVIDIA_H100_80GB)"
        required: false
        type: string
      region:
        description: "Placement region override (e.g. us-iowa-1)"
        required: false
        type: string
      extra_args:
        description: "Additional flags passed verbatim to the create/clone command"
        required: false
        type: string
      wait_timeout:
        description: "How long to wait for healthy state (default: 30m)"
        required: false
        type: string
        default: "30m"
      firectl_version:
        description: "firectl download channel (default: stable)"
        required: false
        type: string
        default: "stable"

  workflow_call:
    inputs:
      source_deployment:
        description: "Source deployment to clone (ID or full resource name)"
        required: true
        type: string
      source_account:
        description: "Account ID that owns the source deployment"
        required: true
        type: string
      target_account:
        description: "Account ID to create the clone in (defaults to source_account)"
        required: false
        type: string
      deployment_id:
        description: "ID for the new deployment (auto-generated if empty)"
        required: false
        type: string
      display_name:
        description: "Display name for the cloned deployment"
        required: false
        type: string
      min_replica_count:
        description: "Minimum replica count override"
        required: false
        type: string
      max_replica_count:
        description: "Maximum replica count override"
        required: false
        type: string
      accelerator_type:
        description: "Accelerator type override (e.g. NVIDIA_H100_80GB)"
        required: false
        type: string
      region:
        description: "Placement region override (e.g. us-iowa-1)"
        required: false
        type: string
      extra_args:
        description: "Additional flags passed verbatim to the create/clone command"
        required: false
        type: string
      wait_timeout:
        description: "How long to wait for healthy state (default: 30m)"
        required: false
        type: string
        default: "30m"
      firectl_version:
        description: "firectl download channel (default: stable)"
        required: false
        type: string
        default: "stable"
    secrets:
      FIREWORKS_API_KEY:
        description: "Fireworks API key with permissions on source and target accounts"
        required: true
    outputs:
      deployment_id:
        description: "The ID of the newly created deployment"
        value: ${{ jobs.clone.outputs.deployment_id }}
      deployment_name:
        description: "Full resource name of the new deployment"
        value: ${{ jobs.clone.outputs.deployment_name }}
      deployment_state:
        description: "Final observed state of the new deployment"
        value: ${{ jobs.clone.outputs.deployment_state }}

jobs:
  clone:
    name: Clone Deployment
    runs-on: ubuntu-latest
    outputs:
      deployment_id: ${{ steps.clone.outputs.deployment_id }}
      deployment_name: ${{ steps.clone.outputs.deployment_name }}
      deployment_state: ${{ steps.wait.outputs.deployment_state }}

    env:
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.source_deployment }}" ]; then
            echo "::error::source_deployment is required"
            exit 1
          fi
          if [ -z "${{ inputs.source_account }}" ]; then
            echo "::error::source_account is required"
            exit 1
          fi
          if [ -z "${FIREWORKS_API_KEY}" ]; then
            echo "::error::FIREWORKS_API_KEY secret is not set"
            exit 1
          fi

      - name: Install firectl
        id: install
        run: |
          CHANNEL="${{ inputs.firectl_version || 'stable' }}"
          URL="https://storage.googleapis.com/fireworks-public/firectl/${CHANNEL}/linux-amd64.gz"

          echo "Downloading firectl from ${URL} ..."
          wget -qO firectl.gz "${URL}"
          gunzip firectl.gz
          sudo install -o root -g root -m 0755 firectl /usr/local/bin/firectl
          echo "Installed firectl $(firectl version)"

          firectl set-api-key "${FIREWORKS_API_KEY}"

      - name: Resolve accounts
        id: accounts
        run: |
          SOURCE_ACCOUNT="${{ inputs.source_account }}"
          TARGET_ACCOUNT="${{ inputs.target_account }}"
          if [ -z "${TARGET_ACCOUNT}" ]; then
            TARGET_ACCOUNT="${SOURCE_ACCOUNT}"
          fi
          echo "source=${SOURCE_ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "target=${TARGET_ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "Source account: ${SOURCE_ACCOUNT}"
          echo "Target account: ${TARGET_ACCOUNT}"

      - name: Fetch source deployment
        id: fetch
        run: |
          SOURCE_ACCOUNT="${{ steps.accounts.outputs.source }}"
          SOURCE_DEPLOYMENT="${{ inputs.source_deployment }}"

          echo "Fetching: accounts/${SOURCE_ACCOUNT}/deployments/${SOURCE_DEPLOYMENT}"

          firectl -a "${SOURCE_ACCOUNT}" deployment get "${SOURCE_DEPLOYMENT}" -o json \
            > /tmp/source_deployment.json

          echo "Source deployment:"
          jq '{name, state, baseModel, acceleratorType, acceleratorCount, minReplicaCount, maxReplicaCount, precision, placement, deploymentShape}' \
            /tmp/source_deployment.json

      - name: Clone deployment
        id: clone
        run: |
          SOURCE_ACCOUNT="${{ steps.accounts.outputs.source }}"
          TARGET_ACCOUNT="${{ steps.accounts.outputs.target }}"
          SOURCE_DEPLOYMENT="${{ inputs.source_deployment }}"
          SOURCE_CONFIG="/tmp/source_deployment.json"

          BASE_MODEL=$(jq -r '.baseModel' "${SOURCE_CONFIG}")

          # Assemble flags — carry source config, let overrides win
          FLAGS=""

          DEPLOYMENT_ID="${{ inputs.deployment_id }}"
          if [ -n "${DEPLOYMENT_ID}" ]; then
            FLAGS="${FLAGS} --deployment-id=${DEPLOYMENT_ID}"
          fi

          DISPLAY_NAME="${{ inputs.display_name }}"
          if [ -n "${DISPLAY_NAME}" ]; then
            FLAGS="${FLAGS} --display-name=${DISPLAY_NAME}"
          fi

          # Replica counts
          MIN_REPLICAS="${{ inputs.min_replica_count }}"
          if [ -z "${MIN_REPLICAS}" ]; then
            MIN_REPLICAS=$(jq -r '.minReplicaCount // empty' "${SOURCE_CONFIG}")
          fi
          if [ -n "${MIN_REPLICAS}" ]; then
            FLAGS="${FLAGS} --min-replica-count=${MIN_REPLICAS}"
          fi

          MAX_REPLICAS="${{ inputs.max_replica_count }}"
          if [ -z "${MAX_REPLICAS}" ]; then
            MAX_REPLICAS=$(jq -r '.maxReplicaCount // empty' "${SOURCE_CONFIG}")
          fi
          if [ -n "${MAX_REPLICAS}" ]; then
            FLAGS="${FLAGS} --max-replica-count=${MAX_REPLICAS}"
          fi

          # Accelerator
          ACCEL_TYPE="${{ inputs.accelerator_type }}"
          if [ -z "${ACCEL_TYPE}" ]; then
            ACCEL_TYPE=$(jq -r '.acceleratorType // empty' "${SOURCE_CONFIG}")
          fi
          if [ -n "${ACCEL_TYPE}" ] && [ "${ACCEL_TYPE}" != "ACCELERATOR_TYPE_UNSPECIFIED" ]; then
            FLAGS="${FLAGS} --accelerator-type=${ACCEL_TYPE}"
          fi

          ACCEL_COUNT=$(jq -r '.acceleratorCount // empty' "${SOURCE_CONFIG}")
          if [ -n "${ACCEL_COUNT}" ] && [ "${ACCEL_COUNT}" != "0" ]; then
            FLAGS="${FLAGS} --accelerator-count=${ACCEL_COUNT}"
          fi

          # Region
          REGION="${{ inputs.region }}"
          if [ -n "${REGION}" ]; then
            FLAGS="${FLAGS} --region=${REGION}"
          fi

          # Precision
          SRC_PRECISION=$(jq -r '.precision // empty' "${SOURCE_CONFIG}")
          if [ -n "${SRC_PRECISION}" ] && [ "${SRC_PRECISION}" != "PRECISION_UNSPECIFIED" ]; then
            FLAGS="${FLAGS} --precision=${SRC_PRECISION}"
          fi

          # Deployment shape
          SRC_SHAPE=$(jq -r '.deploymentShape // empty' "${SOURCE_CONFIG}")
          if [ -n "${SRC_SHAPE}" ]; then
            FLAGS="${FLAGS} --deployment-shape=${SRC_SHAPE}"
          fi

          # Context length
          SRC_CTX=$(jq -r '.maxContextLength // empty' "${SOURCE_CONFIG}")
          if [ -n "${SRC_CTX}" ] && [ "${SRC_CTX}" != "0" ]; then
            FLAGS="${FLAGS} --max-context-length=${SRC_CTX}"
          fi

          # Addons
          SRC_ADDONS=$(jq -r '.enableAddons // empty' "${SOURCE_CONFIG}")
          if [ "${SRC_ADDONS}" = "true" ]; then
            FLAGS="${FLAGS} --enable-addons"
          fi

          # Wait for the deployment to come up healthy
          FLAGS="${FLAGS} --wait --wait-timeout=${{ inputs.wait_timeout || '30m' }}"

          # Extra flags from the caller
          EXTRA_ARGS="${{ inputs.extra_args }}"
          if [ -n "${EXTRA_ARGS}" ]; then
            FLAGS="${FLAGS} ${EXTRA_ARGS}"
          fi

          echo "=== Clone summary ==="
          echo "Source : accounts/${SOURCE_ACCOUNT}/deployments/${SOURCE_DEPLOYMENT}"
          echo "Target : account=${TARGET_ACCOUNT}"
          echo "Model  : ${BASE_MODEL}"
          echo "Flags  : ${FLAGS}"
          echo "====================="

          # shellcheck disable=SC2086
          OUTPUT=$(firectl -a "${TARGET_ACCOUNT}" deployment create \
            "${BASE_MODEL}" \
            ${FLAGS} 2>&1) || {
            echo "::error::firectl deployment create failed"
            echo "${OUTPUT}"
            exit 1
          }

          echo "${OUTPUT}"

          # Extract deployment name from the output (supports both text and json)
          DEPLOYMENT_NAME=$(echo "${OUTPUT}" | jq -r '.name // empty' 2>/dev/null)
          if [ -z "${DEPLOYMENT_NAME}" ]; then
            DEPLOYMENT_NAME=$(echo "${OUTPUT}" | grep -oP '(?<=Name:\s)\S+' || true)
          fi
          NEW_ID=$(echo "${DEPLOYMENT_NAME}" | awk -F'/' '{print $NF}')

          if [ -z "${NEW_ID}" ]; then
            echo "::error::Could not extract deployment ID from output"
            exit 1
          fi

          echo "deployment_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
          echo "deployment_name=${DEPLOYMENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "Created deployment: ${DEPLOYMENT_NAME}"

      - name: Verify deployment health
        id: wait
        run: |
          TARGET_ACCOUNT="${{ steps.accounts.outputs.target }}"
          DEPLOYMENT_ID="${{ steps.clone.outputs.deployment_id }}"

          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "::error::No deployment ID from clone step"
            echo "deployment_state=UNKNOWN" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          STATE=$(firectl -a "${TARGET_ACCOUNT}" deployment get "${DEPLOYMENT_ID}" -o json \
            | jq -r '.state')

          echo "deployment_state=${STATE}" >> "$GITHUB_OUTPUT"
          echo "Deployment state: ${STATE}"

          if [ "${STATE}" != "READY" ]; then
            echo "::warning::Deployment not READY (state: ${STATE})"
            exit 1
          fi

          echo "Deployment is healthy!"

      - name: Summary
        if: always()
        run: |
          DEPLOYMENT_ID="${{ steps.clone.outputs.deployment_id }}"
          DEPLOYMENT_NAME="${{ steps.clone.outputs.deployment_name }}"
          DEPLOYMENT_STATE="${{ steps.wait.outputs.deployment_state }}"
          SOURCE_ACCOUNT="${{ steps.accounts.outputs.source }}"
          TARGET_ACCOUNT="${{ steps.accounts.outputs.target }}"
          SOURCE_DEPLOYMENT="${{ inputs.source_deployment }}"

          if [ "${DEPLOYMENT_STATE}" = "READY" ]; then
            STATUS_EMOJI="white_check_mark"; STATUS_TEXT="Healthy"
          elif [ "${DEPLOYMENT_STATE}" = "FAILED" ]; then
            STATUS_EMOJI="x"; STATUS_TEXT="Failed"
          else
            STATUS_EMOJI="warning"; STATUS_TEXT="${DEPLOYMENT_STATE:-Unknown}"
          fi

          {
            echo "## Deployment Clone Report"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Status** | :${STATUS_EMOJI}: ${STATUS_TEXT} |"
            echo "| **Source** | \`accounts/${SOURCE_ACCOUNT}/deployments/${SOURCE_DEPLOYMENT}\` |"
            echo "| **Clone** | \`${DEPLOYMENT_NAME}\` |"
            echo "| **Clone ID** | \`${DEPLOYMENT_ID}\` |"
            echo "| **Target Account** | \`${TARGET_ACCOUNT}\` |"
            echo "| **Final State** | \`${DEPLOYMENT_STATE}\` |"
            echo ""
            echo "### Overrides Applied"
          } >> "$GITHUB_STEP_SUMMARY"

          HAS_OVERRIDES=false
          for INPUT_NAME in target_account deployment_id display_name min_replica_count max_replica_count accelerator_type region extra_args; do
            VALUE=""
            case "${INPUT_NAME}" in
              target_account) VALUE="${{ inputs.target_account }}" ;;
              deployment_id) VALUE="${{ inputs.deployment_id }}" ;;
              display_name) VALUE="${{ inputs.display_name }}" ;;
              min_replica_count) VALUE="${{ inputs.min_replica_count }}" ;;
              max_replica_count) VALUE="${{ inputs.max_replica_count }}" ;;
              accelerator_type) VALUE="${{ inputs.accelerator_type }}" ;;
              region) VALUE="${{ inputs.region }}" ;;
              extra_args) VALUE="${{ inputs.extra_args }}" ;;
            esac
            if [ -n "${VALUE}" ]; then
              echo "| \`${INPUT_NAME}\` | \`${VALUE}\` |" >> "$GITHUB_STEP_SUMMARY"
              HAS_OVERRIDES=true
            fi
          done

          if [ "${HAS_OVERRIDES}" = "false" ]; then
            echo "_No overrides — exact clone of source deployment._" >> "$GITHUB_STEP_SUMMARY"
          fi
